services:
  db:
    image: postgres:16
    container_name: elplan-db
    environment:
      POSTGRES_USER: elplan
      POSTGRES_PASSWORD: elplan
      POSTGRES_DB: elplan
    # Not published to the host; only reachable inside the compose network.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elplan -d elplan"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: elplan-backend
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://elplan:elplan@db:5432/elplan
      # Same origin as the frontend (served through the proxy).
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips='*'"

  frontend:
    build:
      context: ./frontend
    container_name: elplan-frontend
    depends_on:
      - backend
    expose:
      - "5173"
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 5173"

  proxy:
    image: nginx:1.27-alpine
    container_name: elplan-proxy
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
