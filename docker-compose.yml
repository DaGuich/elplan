services:
  db:
    image: postgres:16
    container_name: elplan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elplan}
      POSTGRES_DB: ${POSTGRES_DB:-elplan}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: elplan-backend
    restart: unless-stopped
    environment:
      ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY (e.g. openssl rand -hex 32)}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-elplan}:${POSTGRES_PASSWORD:-elplan}@db:5432/${POSTGRES_DB:-elplan}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_DISCOVERY_URL: ${OAUTH_DISCOVERY_URL:-}
      OAUTH_AUTHORIZE_URL: ${OAUTH_AUTHORIZE_URL:-}
      OAUTH_TOKEN_URL: ${OAUTH_TOKEN_URL:-}
      OAUTH_USERINFO_URL: ${OAUTH_USERINFO_URL:-}
      OAUTH_SCOPES: ${OAUTH_SCOPES:-openid email profile}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:8080/api/v1/auth/oauth/callback}
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME:-SSO}
      OAUTH_TRUST_EMAIL: ${OAUTH_TRUST_EMAIL:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  # Builds the Vite app and serves the static bundle with nginx
  # (proxies /api to the backend).
  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: elplan-proxy
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
